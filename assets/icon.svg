<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e42"/>
      <stop offset="1" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset=".55" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3ff"/>
    </linearGradient>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- corpo -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g clip-path="url(#shape)">
    <ellipse cx="512" cy="60" rx="560" ry="400" fill="url(#gloss)"/>
    <!-- brilho atrás do glifo -->
    <g filter="url(#glow)" opacity=".55">
      <path d="M345 365 L520 512 L345 659" fill="none" stroke="#6c8cff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- prompt: chevron + cursor -->
  <path d="M345 365 L520 512 L345 659" fill="none" stroke="url(#glyph)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="566" y="616" width="196" height="64" rx="32" fill="url(#cursor)"/>
</svg>
