services:
  dev:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      # node_modules e target ficam em volumes nomeados (mais rápido, não poluem o host)
      - node_modules:/app/node_modules
      - cargo_target:/app/src-tauri/target
      - cargo_registry:/usr/local/cargo/registry
    ports:
      - "1420:1420"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # docker compose run --rm build   -> gera binário/pacotes Linux em src-tauri/target
  build:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cargo_target:/app/src-tauri/target
      - cargo_registry:/usr/local/cargo/registry
    command: sh -c "npm install && npx tauri build"

  # docker compose run --rm check   -> valida frontend (tsc) e backend (cargo check)
  check:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cargo_target:/app/src-tauri/target
      - cargo_registry:/usr/local/cargo/registry
    command: sh -c "npm install && npx tsc && cd src-tauri && cargo check"

volumes:
  node_modules:
  cargo_target:
  cargo_registry:
