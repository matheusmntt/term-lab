<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Term Lab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="drag" data-tauri-drag-region></div>
        <div class="brand"><span class="logo">▸_</span> Term Lab</div>
        <div class="section-title">
          <span>Terminais</span>
          <button id="new-tab" class="icon-btn" title="Novo terminal (⌘T)">+</button>
        </div>
        <nav id="tabs"></nav>
        <div class="sidebar-footer">
          <label>Tema</label>
          <select id="theme"></select>
        </div>
      </aside>
      <section id="content">
        <header id="topbar" data-tauri-drag-region>
          <div id="title" data-tauri-drag-region>shell</div>
          <div class="actions">
            <button id="split" class="icon-btn" title="Dividir painel (⌘D)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M8 3v10"/></svg>
            </button>
          </div>
        </header>
        <main id="panes"></main>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
