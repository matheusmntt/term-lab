<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Term Lab</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="drag" data-tauri-drag-region></div>
        <div class="brand"><img class="logo" src="/icon.png" alt="" /> Term Lab</div>

        <div class="section-title">
          <span>Terminais</span>
          <button id="new-tab" class="icon-btn" title="Novo terminal (⌘T)">+</button>
        </div>
        <nav id="tabs" class="list"></nav>

        <div class="section-title">
          <span>Grupos</span>
          <button id="save-group" class="icon-btn" title="Salvar abas abertas como grupo (⌘⇧S)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>
          </button>
        </div>
        <nav id="groups" class="list"></nav>

        <div id="update-banner" class="update-banner" hidden></div>

        <div class="sidebar-footer">
          <label for="theme">Tema</label>
          <div class="footer-controls">
            <select id="theme" title="Tema"></select>
            <button id="open-prefs" class="icon-btn" title="Preferências (⌘,)">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>
            </button>
          </div>
        </div>
      </aside>
      <section id="content">
        <header id="topbar" data-tauri-drag-region>
          <div id="title" data-tauri-drag-region title="Duplo clique para renomear">shell</div>
          <div class="actions">
            <button id="find-btn" class="icon-btn" title="Buscar no terminal (⌘F)">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.3 10.3L13.8 13.8"/></svg>
            </button>
            <button id="split" class="icon-btn" title="Dividir ao lado (⌘D)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M8 3v10"/></svg>
            </button>
            <button id="split-down" class="icon-btn" title="Dividir abaixo (⌘⇧D)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 8h12"/></svg>
            </button>
          </div>
        </header>
        <main id="panes">
          <div id="search-bar" class="search-bar" hidden>
            <input id="search-input" type="text" placeholder="Buscar…" autocomplete="off" />
            <button id="search-prev" class="icon-btn" title="Anterior (⇧Enter)">↑</button>
            <button id="search-next" class="icon-btn" title="Próximo (Enter)">↓</button>
            <button id="search-close" class="icon-btn" title="Fechar (Esc)">✕</button>
          </div>
        </main>
      </section>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
